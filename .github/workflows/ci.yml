name: CI

on:
  push:
    branches:
      - "*"
      - "*/*"
  pull_request:
    branches:
      - "*"
      - "*/*"

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        version:
          - v2.0.0-alpha.130
          - v2.0.0-alpha.164
          - v2.0.0-alpha.189
          - latest
          - ""
        include:
          - version: v2.0.0-alpha.130
            is_legacy: true
          - version: v2.0.0-alpha.164
            is_legacy: true

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup with version argument
        id: setup1
        if: ${{ matrix.version != '' }}
        uses: ./
        with:
          toit-version: ${{ matrix.version }}

      - name: Setup without version argument
        id: setup2
        if: ${{ matrix.version == '' }}
        uses: ./

      - name: Test Toit in Path
        if: ${{ matrix.is_legacy != true }}
        shell: bash
        run: |
          toit --version

      - name: Test Toit in Path - native shell
        if: ${{ matrix.is_legacy != true }}
        run: |
          toit --version

      - name: Test legacy Toit commands in Path
        if: ${{ matrix.is_legacy == true }}
        shell: bash
        run: |
          toit.run --version
          toit.pkg --version

      - name: Test legacy Toit commands in Path - native shell
        if: ${{ matrix.is_legacy == true }}
        run: |
          toit.run --version
          toit.pkg --version

      - name: Test outputs
        shell: bash
        run: |
          if [[ -z "${{ matrix.version }}" ]]; then
            echo "No version argument"
            TOIT_URL="${{ steps.setup2.outputs.toit-url }}"
            TOIT_DIR="${{ steps.setup2.outputs.toit-install-dir }}"
            TOIT_SDK="${{ steps.setup2.outputs.toit-sdk-path }}"
            TOIT_VERSION="${{ steps.setup2.outputs.toit-version }}"
          else
            echo "With version argument"
            TOIT_URL="${{ steps.setup1.outputs.toit-url }}"
            TOIT_DIR="${{ steps.setup1.outputs.toit-install-dir }}"
            TOIT_SDK="${{ steps.setup1.outputs.toit-sdk-path }}"
            TOIT_VERSION="${{ steps.setup1.outputs.toit-version }}"
          fi
          if [[ "$TOIT_VERSION" == "" ]]; then
            echo "No version"
            exit 1
          fi

          if [[ "${{ matrix.version }}" != "latest" && "${{ matrix.version }}" != "" ]]; then
            if [[ "$TOIT_VERSION" != "${{ matrix.version }}" ]]; then
              echo "Version does not match"
              exit 1
            fi
          fi

          # The install-dir should have a toit directory.
          if [[ ! -d "$TOIT_DIR/toit" ]]; then
            echo "Install dir does not exist"
            exit 1
          fi

          # The SDK-path is the toit directory.
          if [[ "$TOIT_SDK" != "$TOIT_DIR/toit" ]]; then
            echo "SDK path does not match install dir"
            exit 1
          fi

          # The URL should be a valid URL.
          if [[ ! "$TOIT_URL" =~ ^https://.* ]]; then
            echo "URL is not a valid URL"
            exit 1
          fi

          if [[ -n "${{ steps.setup1.outputs.qemu-version }}${{ steps.setup2.outputs.qemu-version }}" ]]; then
            echo "QEMU was installed without a qemu-version"
            exit 1
          fi

          if [[ -n "${QEMU_SYSTEM_XTENSA:-}${QEMU_SYSTEM_RISCV32:-}" ]]; then
            echo "QEMU environment variables were set without a qemu-version"
            exit 1
          fi

  qemu:
    name: QEMU (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-22.04
          - platform: linux-aarch64
            runner: ubuntu-22.04-arm
          - platform: windows-x86_64
            runner: windows-2022
          - platform: macos-x86_64
            runner: macos-15-intel
          - platform: macos-aarch64
            runner: macos-15

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Toit and latest QEMU
        id: setup
        uses: ./
        with:
          qemu-version: latest

      - name: Test QEMU installation
        shell: bash
        env:
          EXPECTED_QEMU_PLATFORM: ${{ matrix.platform }}
          EXPECTED_QEMU_VERSION: v9.2.2-toitlang.1
          QEMU_INSTALL_DIR_OUTPUT: ${{ steps.setup.outputs.qemu-install-dir }}
          QEMU_SYSTEM_RISCV32_OUTPUT: ${{ steps.setup.outputs.qemu-system-riscv32 }}
          QEMU_SYSTEM_XTENSA_OUTPUT: ${{ steps.setup.outputs.qemu-system-xtensa }}
          QEMU_URL: ${{ steps.setup.outputs.qemu-url }}
          QEMU_VERSION: ${{ steps.setup.outputs.qemu-version }}
        run: |
          test "$QEMU_VERSION" = "$EXPECTED_QEMU_VERSION"
          test "$QEMU_SYSTEM_XTENSA" = "$QEMU_SYSTEM_XTENSA_OUTPUT"
          test "$QEMU_SYSTEM_RISCV32" = "$QEMU_SYSTEM_RISCV32_OUTPUT"
          test -x "$QEMU_SYSTEM_XTENSA"
          test -x "$QEMU_SYSTEM_RISCV32"
          test -d "$QEMU_INSTALL_DIR_OUTPUT"
          test "$(tr -d '\r\n' < "$QEMU_INSTALL_DIR_OUTPUT/VERSION")" = \
            "$EXPECTED_QEMU_VERSION"
          [[ "$QEMU_URL" == */qemu-toit-${EXPECTED_QEMU_VERSION}-${EXPECTED_QEMU_PLATFORM}.* ]]

          "$QEMU_SYSTEM_XTENSA" --version |
            grep -Fq "$EXPECTED_QEMU_VERSION"
          "$QEMU_SYSTEM_RISCV32" --version |
            grep -Fq "$EXPECTED_QEMU_VERSION"
          "$QEMU_SYSTEM_XTENSA" -M help | grep -q esp32s3
          "$QEMU_SYSTEM_RISCV32" -M help | grep -q esp32c3

      - name: Test QEMU in native shell PATH
        run: |
          qemu-system-xtensa --version
          qemu-system-riscv32 --version
