name: "Setup Toit"
description: "A GitHub Action to set up Toit and optionally the Toit QEMU fork."
branding:
  icon: "play-circle"
  color: "yellow"

inputs:
  toit-version:
    description: "The version to install. Installs the latest version if not specified."
    default: "latest"
  qemu-version:
    description: "The Toit QEMU release to install. QEMU is not installed if omitted. Use 'latest' for the latest release."

outputs:
  toit-url:
    description: "The URL to the Toit tar.gz file."
    value: ${{ steps.download_toit.outputs.TOIT_URL }}
  toit-install-dir:
    description: "The directory where Toit is installed."
    value: ${{ steps.tmp-dir.outputs.TOIT_INSTALL_DIR }}
  toit-sdk-path:
    description: "The path to the Toit SDK."
    value: ${{ steps.tmp-dir.outputs.TOIT_INSTALL_DIR }}/toit
  toit-version:
    description: "The version of Toit installed."
    value: ${{ steps.toit_version.outputs.TOIT_VERSION }}
  qemu-url:
    description: "The URL to the installed Toit QEMU archive."
    value: ${{ steps.qemu_constants.outputs.QEMU_URL }}
  qemu-install-dir:
    description: "The directory where Toit QEMU is installed."
    value: ${{ steps.qemu_metadata.outputs.QEMU_INSTALL_DIR }}
  qemu-version:
    description: "The Toit QEMU release installed."
    value: ${{ steps.qemu_constants.outputs.QEMU_VERSION }}
  qemu-system-xtensa:
    description: "The path to qemu-system-xtensa."
    value: ${{ steps.qemu_metadata.outputs.QEMU_SYSTEM_XTENSA }}
  qemu-system-riscv32:
    description: "The path to qemu-system-riscv32."
    value: ${{ steps.qemu_metadata.outputs.QEMU_SYSTEM_RISCV32 }}

runs:
  using: "composite"
  steps:
    - name: Setup constants
      shell: bash
      id: setup_constants
      run: |
        TOIT_VERSION=${{ inputs.toit-version }}

        ASSETS_NAMING_THRESHOLD_VERSION=v2.0.0-alpha.164

        # Use sort -V to compare versions.
        if [[ "$TOIT_VERSION" == "latest" ]] || \
            [[ "$(echo -e "$ASSETS_NAMING_THRESHOLD_VERSION\n$TOIT_VERSION" | sort -V | tail -n 1)" == "$TOIT_VERSION" ]]; then
          if [[ "$RUNNER_OS" = "Linux" ]]; then
            case "$(uname -m)" in
              x86_64)  TOIT_FILE=toit-linux-x64.tar.gz ;;
              armv7l)  TOIT_FILE=toit-linux-armv7.tar.gz ;;
              aarch64) TOIT_FILE=toit-linux-aarch64.tar.gz ;;
              *)
                echo "UNSUPPORTED ARCHITECTURE: $(uname -m)"
                exit 1
                ;;
            esac
          elif [[ "$RUNNER_OS" = "macOS" ]]; then
            case "$(uname -m)" in
              x86_64) TOIT_FILE=toit-macos-x64.tar.gz ;;
              arm64)  TOIT_FILE=toit-macos-aarch64.tar.gz ;;
              *)
                echo "UNSUPPORTED ARCHITECTURE: $(uname -m)"
                exit 1
                ;;
            esac
            TOIT_FALLBACK_FILE=toit-macos.tar.gz
          elif [[ "$RUNNER_OS" = "Windows" ]]; then
            TOIT_FILE=toit-windows-x64.tar.gz
          else
            echo "UNSUPPORTED RUNNER: $RUNNER_OS"
            exit 1
          fi
        else
          if [[ "$RUNNER_OS" = "Linux" ]]; then
            case "$(uname -m)" in
              x86_64)  TOIT_FILE=toit-linux.tar.gz;;
              armv7l)  TOIT_FILE=toit-rpi.tar.gz;;
              aarch64) TOIT_FILE=toit-aarch64.tar.gz;;
              *)
                echo "UNSUPPORTED ARCHITECTURE: $(uname -m)"
                exit 1
                ;;
            esac
          elif [[ "$RUNNER_OS" = "macOS" ]]; then
            TOIT_FILE=toit-macos.tar.gz
          elif [[ "$RUNNER_OS" = "Windows" ]]; then
            TOIT_FILE=toit-windows.tar.gz
          else
            echo "UNSUPPORTED RUNNER: $RUNNER_OS"
            exit 1
          fi
        fi

        echo "TOIT_FILE=$TOIT_FILE" >> $GITHUB_OUTPUT

        if [[ $TOIT_VERSION = latest ]]; then
          TOIT_RELEASE_URL=https://github.com/toitlang/toit/releases/latest/download
        else
          TOIT_RELEASE_URL=https://github.com/toitlang/toit/releases/download/$TOIT_VERSION
        fi

        echo "TOIT_URL=$TOIT_RELEASE_URL/$TOIT_FILE" >> "$GITHUB_OUTPUT"
        if [[ "$RUNNER_OS" = "macOS" && -n "${TOIT_FALLBACK_FILE:-}" ]]; then
          echo "TOIT_FALLBACK_URL=$TOIT_RELEASE_URL/$TOIT_FALLBACK_FILE" >> \
            "$GITHUB_OUTPUT"
        fi

    - name: Setup QEMU constants
      if: ${{ inputs.qemu-version != '' }}
      id: qemu_constants
      shell: bash
      env:
        INPUT_QEMU_VERSION: ${{ inputs.qemu-version }}
      run: |
        QEMU_VERSION=$INPUT_QEMU_VERSION
        if [[ "$QEMU_VERSION" == "latest" ]]; then
          latest_url=$(curl --fail --silent --show-error --location \
            --output /dev/null --write-out '%{url_effective}' \
            https://github.com/toitlang/qemu/releases/latest)
          latest_url=${latest_url%/}
          QEMU_VERSION=${latest_url##*/}
          if [[ -z "$QEMU_VERSION" || "$QEMU_VERSION" == "latest" ]]; then
            echo "Could not resolve the latest Toit QEMU release" >&2
            exit 1
          fi
        fi

        if [[ ! "$QEMU_VERSION" =~ ^v[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
          echo "Invalid Toit QEMU release: $QEMU_VERSION" >&2
          exit 1
        fi

        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64)
            QEMU_PLATFORM=linux-x86_64
            QEMU_EXTENSION=tar.gz
            ;;
          Linux-ARM64)
            QEMU_PLATFORM=linux-aarch64
            QEMU_EXTENSION=tar.gz
            ;;
          macOS-X64)
            QEMU_PLATFORM=macos-x86_64
            QEMU_EXTENSION=tar.gz
            ;;
          macOS-ARM64)
            QEMU_PLATFORM=macos-aarch64
            QEMU_EXTENSION=tar.gz
            ;;
          Windows-X64)
            QEMU_PLATFORM=windows-x86_64
            QEMU_EXTENSION=zip
            ;;
          *)
            echo "UNSUPPORTED QEMU RUNNER: $RUNNER_OS-$RUNNER_ARCH" >&2
            exit 1
            ;;
        esac

        QEMU_PACKAGE=qemu-toit-${QEMU_VERSION}-${QEMU_PLATFORM}
        QEMU_FILE=${QEMU_PACKAGE}.${QEMU_EXTENSION}
        QEMU_RELEASE_URL=https://github.com/toitlang/qemu/releases/download/${QEMU_VERSION}

        echo "QEMU_VERSION=$QEMU_VERSION" >> "$GITHUB_OUTPUT"
        echo "QEMU_PACKAGE=$QEMU_PACKAGE" >> "$GITHUB_OUTPUT"
        echo "QEMU_FILE=$QEMU_FILE" >> "$GITHUB_OUTPUT"
        echo "QEMU_URL=$QEMU_RELEASE_URL/$QEMU_FILE" >> "$GITHUB_OUTPUT"
        echo "QEMU_CHECKSUMS_URL=$QEMU_RELEASE_URL/SHA256SUMS" >> "$GITHUB_OUTPUT"

    - name: Create temporary directory
      # Linux and macOS.
      if: startsWith(runner.os, 'Linux') || startsWith(runner.os, 'macOS')
      shell: bash
      run: |
        INSTALL_DIR=$(mktemp -d)
        echo "TOIT_INSTALL_DIR=$INSTALL_DIR" >> $GITHUB_ENV

    - name: Create temporary directory
      # Windows.
      if: startsWith(runner.os, 'Windows')
      shell: powershell
      run: |
        $tempDir = New-TemporaryFile | % { $_.DirectoryName }
        echo "TOIT_INSTALL_DIR=$tempDir" | Out-File -FilePath $env:GITHUB_ENV -Append
        echo "Temporary directory is $tempDir"

    - name: Output temporary directory
      shell: bash
      id: tmp-dir
      run: |
        echo TOIT_INSTALL_DIR=$TOIT_INSTALL_DIR >> $GITHUB_OUTPUT

    - name: Download Toit
      id: download_toit
      shell: bash
      env:
        TOIT_FALLBACK_URL: ${{ steps.setup_constants.outputs.TOIT_FALLBACK_URL }}
        TOIT_FILE: ${{ steps.setup_constants.outputs.TOIT_FILE }}
        TOIT_URL: ${{ steps.setup_constants.outputs.TOIT_URL }}
      run: |
        cd '${{ steps.tmp-dir.outputs.TOIT_INSTALL_DIR }}'
        INSTALLED_TOIT_URL=$TOIT_URL
        if ! curl --fail --location --retry 3 --show-error \
            --output "$TOIT_FILE" "$TOIT_URL"; then
          if [[ "$RUNNER_OS" != "macOS" ]]; then
            echo "Could not download Toit from $TOIT_URL" >&2
            exit 1
          fi

          if [[ -z "$TOIT_FALLBACK_URL" ]]; then
            echo "No fallback URL is available for macOS" >&2
            exit 1
          fi

          echo "Falling back to $TOIT_FALLBACK_URL" >&2
          curl --fail --location --retry 3 --show-error \
            --output "$TOIT_FILE" "$TOIT_FALLBACK_URL"
          INSTALLED_TOIT_URL=$TOIT_FALLBACK_URL
        fi

        echo "TOIT_URL=$INSTALLED_TOIT_URL" >> "$GITHUB_OUTPUT"

    - name: Extract Toit
      shell: bash
      run: |
        cd '${{ steps.tmp-dir.outputs.TOIT_INSTALL_DIR }}'
        # Extracts the tar.gz leaving a 'toit' directory containing 'bin', 'tools' and 'lib' directory.
        tar x -zf toit-*.tar.gz

    - name: Download and verify QEMU
      if: ${{ inputs.qemu-version != '' }}
      shell: bash
      env:
        QEMU_CHECKSUMS_URL: ${{ steps.qemu_constants.outputs.QEMU_CHECKSUMS_URL }}
        QEMU_FILE: ${{ steps.qemu_constants.outputs.QEMU_FILE }}
        QEMU_URL: ${{ steps.qemu_constants.outputs.QEMU_URL }}
        TOIT_INSTALL_DIR: ${{ steps.tmp-dir.outputs.TOIT_INSTALL_DIR }}
      run: |
        cd "$TOIT_INSTALL_DIR"
        curl --fail --location --retry 3 --show-error \
          --output "$QEMU_FILE" "$QEMU_URL"
        curl --fail --location --retry 3 --show-error \
          --output SHA256SUMS "$QEMU_CHECKSUMS_URL"

        expected=$(awk -v file="$QEMU_FILE" '$2 == file { print $1 }' SHA256SUMS)
        if [[ ! "$expected" =~ ^[0-9a-fA-F]{64}$ ]]; then
          echo "No valid checksum found for $QEMU_FILE" >&2
          exit 1
        fi

        if command -v sha256sum >/dev/null 2>&1; then
          actual=$(sha256sum "$QEMU_FILE" | awk '{ print $1 }')
        elif command -v shasum >/dev/null 2>&1; then
          actual=$(shasum -a 256 "$QEMU_FILE" | awk '{ print $1 }')
        else
          echo "No SHA-256 checksum tool is available" >&2
          exit 1
        fi

        if [[ "$actual" != "$expected" ]]; then
          echo "Checksum verification failed for $QEMU_FILE" >&2
          exit 1
        fi

    - name: Extract QEMU
      if: ${{ inputs.qemu-version != '' && runner.os != 'Windows' }}
      shell: bash
      env:
        QEMU_FILE: ${{ steps.qemu_constants.outputs.QEMU_FILE }}
        TOIT_INSTALL_DIR: ${{ steps.tmp-dir.outputs.TOIT_INSTALL_DIR }}
      run: |
        tar -C "$TOIT_INSTALL_DIR" -xzf "$TOIT_INSTALL_DIR/$QEMU_FILE"

    - name: Extract QEMU
      if: ${{ inputs.qemu-version != '' && runner.os == 'Windows' }}
      shell: powershell
      env:
        QEMU_FILE: ${{ steps.qemu_constants.outputs.QEMU_FILE }}
        TOIT_INSTALL_DIR: ${{ steps.tmp-dir.outputs.TOIT_INSTALL_DIR }}
      run: |
        Expand-Archive `
          -LiteralPath (Join-Path $env:TOIT_INSTALL_DIR $env:QEMU_FILE) `
          -DestinationPath $env:TOIT_INSTALL_DIR

    - name: Set QEMU outputs
      if: ${{ inputs.qemu-version != '' }}
      id: qemu_metadata
      shell: bash
      env:
        QEMU_PACKAGE: ${{ steps.qemu_constants.outputs.QEMU_PACKAGE }}
        TOIT_INSTALL_DIR: ${{ steps.tmp-dir.outputs.TOIT_INSTALL_DIR }}
      run: |
        QEMU_INSTALL_DIR=$TOIT_INSTALL_DIR/$QEMU_PACKAGE
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          suffix=.exe
        else
          suffix=
        fi

        QEMU_SYSTEM_XTENSA=$QEMU_INSTALL_DIR/bin/qemu-system-xtensa${suffix}
        QEMU_SYSTEM_RISCV32=$QEMU_INSTALL_DIR/bin/qemu-system-riscv32${suffix}
        test -x "$QEMU_SYSTEM_XTENSA"
        test -x "$QEMU_SYSTEM_RISCV32"

        echo "QEMU_INSTALL_DIR=$QEMU_INSTALL_DIR" >> "$GITHUB_OUTPUT"
        echo "QEMU_SYSTEM_XTENSA=$QEMU_SYSTEM_XTENSA" >> "$GITHUB_OUTPUT"
        echo "QEMU_SYSTEM_RISCV32=$QEMU_SYSTEM_RISCV32" >> "$GITHUB_OUTPUT"
        echo "QEMU_SYSTEM_XTENSA=$QEMU_SYSTEM_XTENSA" >> "$GITHUB_ENV"
        echo "QEMU_SYSTEM_RISCV32=$QEMU_SYSTEM_RISCV32" >> "$GITHUB_ENV"

    - name: Add to PATH
      # Linux and macOS.
      if : startsWith(runner.os, 'Linux') || startsWith(runner.os, 'macOS')
      shell: bash
      run: |
        echo "${{ steps.tmp-dir.outputs.TOIT_INSTALL_DIR }}/toit/bin" >> $GITHUB_PATH

    - name: Add to PATH
      # Windows.
      shell: powershell
      if: startsWith(runner.os, 'Windows')
      run: |
        echo "${{ steps.tmp-dir.outputs.TOIT_INSTALL_DIR }}/toit/bin" | Out-File -FilePath $env:GITHUB_PATH -Append

    - name: Add QEMU to PATH
      if: ${{ inputs.qemu-version != '' && runner.os != 'Windows' }}
      shell: bash
      run: |
        echo "${{ steps.qemu_metadata.outputs.QEMU_INSTALL_DIR }}/bin" >> "$GITHUB_PATH"

    - name: Add QEMU to PATH
      if: ${{ inputs.qemu-version != '' && runner.os == 'Windows' }}
      shell: powershell
      run: |
        "${{ steps.qemu_metadata.outputs.QEMU_INSTALL_DIR }}/bin" |
          Out-File -FilePath $env:GITHUB_PATH -Append

    - name: Set Toit version output
      id: toit_version
      shell: bash
      run: |
        cd '${{ steps.tmp-dir.outputs.TOIT_INSTALL_DIR }}'
        # Prefer a VERSION file if present.
        if [ -f "toit/VERSION" ]; then
          echo "TOIT_VERSION=$(sed 's/[[:space:]]*$//' toit/VERSION)" >> $GITHUB_OUTPUT
          exit 0
        fi

        # Detect executable suffix on Windows.
        SUFFIX=""
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          SUFFIX=".exe"
        fi

        # Prefer exact name; otherwise, pick the first matching executable in toit/bin.
        if [ -x "toit/bin/toit$SUFFIX" ]; then
          TOIT_BIN="toit/bin/toit$SUFFIX"
        else
          TOIT_BIN="$(find "toit/bin" -maxdepth 1 -type f -name "toit*${SUFFIX}" | head -n1)"
        fi

        if [ -z "$TOIT_BIN" ]; then
          echo "Toit binary not found in toit/bin" >&2
          exit 1
        fi

        # 'toit version' prints something like 'v2.0.0-alpha.189' on the first line.
        VERSION_OUT="$($TOIT_BIN version | head -n1 | sed 's/[[:space:]]*$//')"
        echo "TOIT_VERSION=$VERSION_OUT" >> $GITHUB_OUTPUT
